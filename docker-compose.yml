services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_USER: rating
      POSTGRES_DB: rating
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rating"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  rating-api:
    build: ./rating-api
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
      DATABASE_URL: postgres://rating:example@postgres:5432/rating
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  quackle-service:
    build:
      context: ./service-quackle
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      QUACKLE_LEXDIR: /data/lexica
      QUACKLE_APPDATA_DIR: /data/appdata
      QUACKLE_LEXICON: enable1
      QUACKLE_TIMEOUT_MS: 8000
      # CORS: override from .env.compose if provided
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"

      # Lexicon URLs: interpolated from .env.compose via --env-file
      GADDAG_URL: "${GADDAG_URL}"
      DAWG_URL:   "${DAWG_URL}"
      DEBUG_BRIDGE_PAYLOAD: "true"   # opzionale: logga stdin/stdout/stderr del bridge
      DEBUG_ENABLE_LDD: "true"       # opzionale: abilita /debug/ldd
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
