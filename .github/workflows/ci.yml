name: CI

on:
  push:
    branches: [ main, "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  node-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            rating-api/package-lock.json

      - name: Install dependencies (root)
        run: npm ci || npm i

      - name: Lint (root)
        run: npm run lint

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Test (frontend)
        run: npm test -- --run

      - name: Install dependencies (rating-api)
        run: npm --prefix rating-api ci || npm --prefix rating-api i

      - name: Test (rating-api)
        run: npm --prefix rating-api test -- --run

      - name: Repo size report
        if: always()
        run: |
          echo "Git count-objects (human readable):"
          git count-objects -vH || true
          echo "\nTop 20 largest files (current checkout):"
          ls -alhR | awk '{print $5 "\t" $9}' | sort -h -r | head -n 20 || true
          echo "\nAttempting git-sizer (optional):"
          curl -fsSL https://github.com/github/git-sizer/releases/latest/download/git-sizer-linux-amd64.zip -o /tmp/git-sizer.zip || true
          (cd /tmp && unzip -o git-sizer.zip >/dev/null 2>&1 && sudo mv git-sizer /usr/local/bin/git-sizer || true)
          git-sizer || true
