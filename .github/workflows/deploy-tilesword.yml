name: Deploy Tilesword to Heroku
on:
  push:
    branches:
      - main

env:
  HEROKU_APP: tilesword
  FRONTEND_URL: https://tilesword-0d2009186065.herokuapp.com
  QUACKLE_SERVICE_URL: https://service-quackle-6773ae98281f.herokuapp.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache npm per stabilità/velocità
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - run: npm run build:prod

      # Guardrail: il bundle production deve puntare al servizio Quackle live.
      - name: Verify bundle targets Quackle service
        run: |
          JS=$(ls dist/assets/index-*.js | head -n1)
          grep -q "$QUACKLE_SERVICE_URL" "$JS"

      # Build immagine Nginx statica che copia /dist
      - run: docker build -t registry.heroku.com/${{ env.HEROKU_APP }}/web -f Dockerfile-frontend-static .

      # Login al registry & push
      - name: Login to Heroku Container Registry
        run: >-
          docker run --rm -e HEROKU_API_KEY=${{ secrets.HEROKU_API_KEY }} heroku/heroku:22-build bash -lc
          "heroku container:login"
      - run: docker push registry.heroku.com/${{ env.HEROKU_APP }}/web

      # Release
      - name: Release container on Heroku
        run: >-
          docker run --rm
          -e HEROKU_API_KEY=${{ secrets.HEROKU_API_KEY }}
          -e HEROKU_APP=${{ env.HEROKU_APP }}
          heroku/heroku:22-build bash -lc
          "heroku container:login && heroku container:release web -a $HEROKU_APP"

      # Smoke test
      - name: Smoke FE
        run: |
          curl -sSfI "$FRONTEND_URL/" >/dev/null
      - name: Smoke BE
        run: |
          curl -sSf "$QUACKLE_SERVICE_URL/health" |
            jq -e '.engine_ready == true and .strategy_ready == true and .binary_present == true and .lexicon == "enable1.15"'
