name: quackle-service-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        working-directory: service-quackle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        working-directory: service-quackle
        run: pytest -q

      - name: Latency probe (p50/p95/p99)
        id: probe
        working-directory: service-quackle
        env:
          N: '30'
        run: |
          python scripts/latency_probe.py > latency.json
          cat latency.json
          echo "latency=$(cat latency.json)" >> $GITHUB_OUTPUT

      - name: Assert latency count increased
        run: |
          python - <<'PY'
          import json, os
          raw = os.environ.get('LAT') or '{}'
          data = json.loads(raw)
          assert data.get('delta', 0) > 0, f"no samples recorded: {raw}"
          print('OK latency samples recorded')
          PY
        env:
          LAT: ${{ steps.probe.outputs.latency }}
