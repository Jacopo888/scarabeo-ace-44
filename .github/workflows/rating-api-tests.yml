name: rating-api tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install rating-api deps
        working-directory: rating-api
        run: npm ci

      - name: Run rating-api tests
        working-directory: rating-api
        env:
          NODE_ENV: test
        run: npm test --silent
