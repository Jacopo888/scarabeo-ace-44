name: deprecated-railway-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC (optional)

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Railway smoketest
        env:
          BASE_URL: ${{ secrets.RAILWAY_BASE_URL }}
        run: |
          if [ -z "${BASE_URL:-}" ]; then
            echo "Missing secret RAILWAY_BASE_URL" >&2
            exit 2
          fi
          bash ./scripts/smoketest-railway.sh | tee railway-smoke.log

      - name: Upload smoketest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railway-smoke-log
          path: railway-smoke.log
