name: CI Smoke Quackle

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Posizione predefinita dei lessici corretti (repo Jacopo888/quackle)
      GADDAG_URL: https://raw.githubusercontent.com/Jacopo888/quackle/master/data/lexica/enable1.15.gaddag
      DAWG_URL:   https://raw.githubusercontent.com/Jacopo888/quackle/master/data/lexica/enable1.15.dawg

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps
        run: npm i

      - name: Prepare lexica volume (directories only)
        run: |
          mkdir -p data/lexica data/appdata/strategy
          ls -l data/lexica || true

      - name: Build and start quackle-service (with lexicon URLs)
        env:
          GADDAG_URL: ${{ env.GADDAG_URL }}
          DAWG_URL: ${{ env.DAWG_URL }}
        run: |
          GADDAG_URL="$GADDAG_URL" DAWG_URL="$DAWG_URL" docker compose up -d --build quackle-service
          docker compose ps

      - name: Wait for health
        env:
          QUACKLE_BASE: http://localhost:8080
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$QUACKLE_BASE/health") || code=000
            echo "Attempt $i: $code"
            if [ "$code" = "200" ]; then
              curl -s "$QUACKLE_BASE/health" | jq . || true
              break
            fi
            sleep 2
          done
          [ "$code" = "200" ] || (docker compose logs quackle-service && exit 1)

      - name: Run smoke test (Node)
        env:
          QUACKLE_BASE: http://localhost:8080
        run: npm run smoke:ci

      - name: Dump quackle logs on failure
        if: failure()
        run: docker compose logs quackle-service || true
